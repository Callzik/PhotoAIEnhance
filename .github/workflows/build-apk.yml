name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and verify ESPCN x2 model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 --output app/src/main/assets/espcn-x2.onnx \
            https://github.com/clibdev/ESPCN-PyTorch/releases/download/1.0.0/espcn-x2.onnx
          echo "6c806349be7f963f3d0895050a771a5de15e9950361e2a2f92624e4b1f675044  app/src/main/assets/espcn-x2.onnx" | sha256sum -c -
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoAIEnhance-v1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error