name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and verify Real-ESRGAN General x4v3
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 --output app/src/main/assets/realesr-general-x4v3.onnx \
            https://huggingface.co/CoderViking/realesr-general-x4v3-onnx/resolve/c6a971706797c7502945a2b4c4274fce4900d4ab/realesr-general-x4v3.onnx
          echo "1940a93ee08283a0a7286183186357b1688fe9fa8ede74604b424586aaddf112  app/src/main/assets/realesr-general-x4v3.onnx" | sha256sum -c -
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoAIEnhance-v1.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error